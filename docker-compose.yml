services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: emp
            MYSQL_USER: emp
            MYSQL_PASSWORD: password
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        volumes:
            - emp_mysql:/var/lib/mysql
            - ./docker/mysql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ppassword']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    emp_mysql:
